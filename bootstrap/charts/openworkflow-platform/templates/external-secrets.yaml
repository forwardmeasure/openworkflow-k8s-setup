apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.storeName }}
spec:
  provider:
    {{- toYaml .Values.externalSecrets.provider | nindent 4 }}

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-credentials
  namespace: {{ .Values.namespaces.identity }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: keycloak-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.keycloakDatabase }}
        property: password
    - secretKey: admin-username
      remoteRef:
        key: {{ .Values.secrets.keycloakAdmin }}
        property: username
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.secrets.keycloakAdmin }}
        property: password

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openworkflow-database
  namespace: {{ .Values.namespaces.actorEngine }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: openworkflow-database
    creationPolicy: Owner
    template:
      data:
        jdbc-url: {{ printf "jdbc:postgresql://%s:5432/%s" .Values.cloudsqlPrivateIp .Values.databases.actorEngine | quote }}
        username: {{ .Values.databaseUsers.actorEngine | quote }}
        password: "{{ `{{ .password }}` }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.secrets.actorEngineDatabase }}
        property: password
