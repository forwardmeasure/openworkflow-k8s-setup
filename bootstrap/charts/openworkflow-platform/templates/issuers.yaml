apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: {{ .Values.acmeEmail | quote }}
    server: {{ .Values.acmeServer | quote }}
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.gateway.name }}
                namespace: {{ .Values.gateway.namespace }}
                kind: Gateway

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-tls
  namespace: {{ .Values.gateway.namespace }}
spec:
  secretName: platform-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.authHostname | quote }}
    - {{ printf "actor.%s" .Values.rootDomain | quote }}
    - {{ printf "kafka.%s" .Values.rootDomain | quote }}
