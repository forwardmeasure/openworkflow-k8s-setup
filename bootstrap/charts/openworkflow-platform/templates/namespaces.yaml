{{- range $name := list .Values.namespaces.identity .Values.namespaces.kafka .Values.namespaces.actorEngine .Values.namespaces.kafkaStreams }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/part-of: openworkflow-platform
    {{- if or (eq $name $.Values.namespaces.actorEngine) (eq $name $.Values.namespaces.kafkaStreams) }}
    istio-injection: enabled
    {{- end }}
{{- end }}
