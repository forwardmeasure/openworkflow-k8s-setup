apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-gateway-options
  namespace: {{ .Values.gateway.namespace }}
data:
  service: |
    spec:
      loadBalancerIP: {{ .Values.gatewayIp | quote }}
      externalTrafficPolicy: Local
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 5
  podDisruptionBudget: |
    spec:
      minAvailable: 1

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.gateway.namespace }}
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: platform-gateway-options
  addresses:
    - type: IPAddress
      value: {{ .Values.gatewayIp | quote }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: {{ .Values.gateway.listenerName }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: platform-tls
      allowedRoutes:
        namespaces:
          from: All

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: {{ .Values.namespaces.identity }}
spec:
  hostnames:
    - {{ .Values.authHostname | quote }}
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listenerName }}
  rules:
    - backendRefs:
        - name: keycloak-keycloakx-http
          port: 80
